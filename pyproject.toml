[project]
name = "vmvt-bot"
version = "1.0.0"
description = "Telegram bot that downloads TikTok videos without watermark"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The project is deployed with `pip install -r requirements.txt` (see render.yaml),
# this file only holds the tooling configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012", "RUF001"]  # RUF001: Khmer text and emoji are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM300", "SIM117"]
"bot/http_server.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
